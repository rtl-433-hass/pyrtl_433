name: Release
on:
  push:
    branches: [main]

# No GITHUB_TOKEN write scopes needed: the App token minted below carries its
# own Contents/Pull-requests write scopes. contents: read is kept so the called
# CI workflow can check out the repo.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          release-type: python
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        with:
          python-version: "3.14"
      - name: Update uv.lock
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          uv lock
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: update uv.lock for release"
            git push
          fi
