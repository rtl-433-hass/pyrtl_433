[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrtl_433"
version = "0.2.0"
description = "Standalone async client for the rtl_433 WebSocket/HTTP API."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Andrew Berry" }]
keywords = ["rtl_433", "rtl-sdr", "websocket", "aiohttp", "asyncio", "sdr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = ["aiohttp", "pyyaml"]

[project.urls]
Homepage = "https://github.com/rtl-433-hass/pyrtl_433"
Repository = "https://github.com/rtl-433-hass/pyrtl_433"
Documentation = "https://rtl-433-hass.github.io/pyrtl_433/"
Issues = "https://github.com/rtl-433-hass/pyrtl_433/issues"

# uv-first dev tooling: `uv sync` installs this group by default; `uv run <tool>`
# executes them. There are no pip-style requirements*.txt files.
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "pytest-aiohttp>=1.1",
    "pytest-cov>=7",
    "pytest-xdist>=3",
    "mutmut==3.7.0",
    "mutmut-ratchet>=0.1.0",
    "ruff==0.16.5",
    "mypy>=1.19",
    "types-PyYAML>=6",
]

[tool.setuptools]
packages = ["pyrtl_433", "pyrtl_433.library"]

# The device library ships its YAML data (and the typing marker) inside the
# wheel/sdist; without this the loader finds an empty ``library/data``.
[tool.setuptools.package-data]
pyrtl_433 = ["library/data/*.yaml", "py.typed"]

[tool.mypy]
strict = true
files = ["pyrtl_433"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use a running rtl_433 endpoint)",
]
filterwarnings = [
    # Treat warnings as errors to catch issues early
    "error",
]

[tool.coverage.run]
source = ["pyrtl_433"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by the formatter)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["pyrtl_433"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is fine in tests
    "PLR2004", # Magic values are fine in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mutmut]
# Mutation testing config (mutmut 3.x). mutmut copies source_paths plus the
# auto-included tests/ + pyproject.toml into a mutants/ working copy and runs the
# pytest suite there, forking once per mutant. The whole package must be in scope
# so intra-package imports resolve inside mutants/.
source_paths = ["pyrtl_433/"]
pytest_add_cli_args_test_selection = ["tests/"]

# Shared mutation CI tooling (https://github.com/rtl-433-hass/mutmut-ratchet).
# These are the per-repo constants the deleted ``scripts/mutation_*.py`` helpers
# used to hard-code.
[tool.mutmut_ratchet]
package_path = "pyrtl_433"
# Changes to these escalate a scoped PR run to a full one: they can move results
# package-wide, so scoping to the diff would not be sound.
escalate_paths = ["pyproject.toml", "tests/conftest.py", "uv.lock"]

# Tests whose filename does not map 1:1 to a source module via the
# ``test[_mut]_<name>.py`` -> ``<name>.py`` convention, declared with the modules
# they actually exercise so a PR touching them scopes instead of escalating.
# Genuinely broad tests are deliberately left out, so they still escalate.
#
# An entry that under-specifies a test's modules is caught by the full runs
# (which re-verify the entire baseline), so it is a delayed catch, never a silent
# floor blind spot.
[tool.mutmut_ratchet.explicit_test_sources]
# ``_urls.py`` has a leading underscore, so the convention resolves ``test_urls``
# to a non-existent ``urls.py``; map it.
"tests/test_urls.py" = ["_urls.py"]
# Mutation-floor test files: the ``_floor`` suffix does not auto-resolve.
"tests/test_mut_client_floor.py" = ["client.py"]
# ``library`` is a package, not a module, so ``test_library`` resolves to a
# non-existent ``library.py``. Its three test files each exercise the whole
# subpackage (the facade re-exports every private helper they import), so all
# three map to every module in it.
"tests/test_library.py" = [
    "library/__init__.py",
    "library/_loader.py",
    "library/_model.py",
    "library/_overrides.py",
    "library/_transform.py",
]
"tests/test_mut_library.py" = [
    "library/__init__.py",
    "library/_loader.py",
    "library/_model.py",
    "library/_overrides.py",
    "library/_transform.py",
]
"tests/test_mut_library_floor.py" = [
    "library/__init__.py",
    "library/_loader.py",
    "library/_model.py",
    "library/_overrides.py",
    "library/_transform.py",
]
