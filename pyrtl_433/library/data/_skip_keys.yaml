# Identity / diagnostic / transport keys that must NOT produce entities.
#
# The first block is a verbatim port of the upstream `SKIP_KEYS` list from
# `rtl_433_mqtt_hass.py`. The loader reads `skip_keys` as a flat list
# and excludes any field whose name appears here before attempting a mapping
# lookup.
#
# `channel`, `id`, `subtype` and `model` form the device identity (used by the
# normalizer to derive the device key) and so are never measurement entities.

skip_keys:
  # --- upstream SKIP_KEYS (verbatim) ---
  - type
  - model
  - subtype
  - channel
  - id
  - mic
  - mod
  # `freq` is NOT skipped: it is mapped to a diagnostic Frequency sensor
  # (disabled by default) in misc.yaml so the per-event tuned frequency can be
  # recorded when rtl_433 reports level data.
  - sequence_num
  - message_type
  - exception
  - raw_msg
  # --- additional non-measurement / transport keys ---
  # Secondary frequency / radio-tuning fields emitted by some rtl_433 builds.
  - freq1
  - freq2
  # protocol number and decoder bookkeeping.
  - protocol
  # SCMplus identity / transport fields, both of which upstream itself marks for
  # removal. `EndpointID` carries the same value as `id` ("TODO: remove this
  # (see \"id\")"), so it would only ever duplicate the device identity, and
  # `PacketCRC` is the frame checksum -- transport noise, like `mic`
  # ("TODO: remove this"). Links pinned to a commit so the lines stay accurate:
  #   EndpointID: https://github.com/merbanan/rtl_433/blob/65e26f518077cafb595f5984201b9f7c121406ef/src/devices/scmplus.c#L146
  #   PacketCRC:  https://github.com/merbanan/rtl_433/blob/65e26f518077cafb595f5984201b9f7c121406ef/src/devices/scmplus.c#L149
  - EndpointID
  - PacketCRC
  # Interlogix's `raw_message` is message bytes 3..5 as hex: the 3-bit trigger
  # (replay) counter, the battery bit and the latch bits. The counter changes on
  # every transmission and the rest is already exposed as `battery_ok` and
  # `switch1`..`switch5`, so it is transport noise like `raw_msg`. Interlogix is
  # its only emitter in src/devices (insteon.c has it commented out).
  #   https://github.com/merbanan/rtl_433/blob/a1794a042eef0d723c298ec95139687cb61f3e06/src/devices/interlogix.c#L192-L193
  - raw_message
